name: Build Dornwacht Taschenbuch
on:
  push:
    branches: [main]
    paths:
      - 'tool/build_taschenbuch.py'
      - '.github/workflows/build-taschenbuch.yml'
      - 'roman/Die_Glocken_von_Dornwacht.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: python -m pip install python-docx==1.2.0
      - name: Build 12x19 cm paperback
        run: python tool/build_taschenbuch.py
      - name: Commit updated Word edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/Die_Glocken_von_Dornwacht.docx
          if ! git diff --cached --quiet; then
            git commit -m "Export: aktualisierte 12x19 cm Taschenbuch-Lesefassung"
            git push
          fi
